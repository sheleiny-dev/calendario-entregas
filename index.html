<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calendario de entregas</title>
<style>
  /* Colores inspirados en la impresión: cian, magenta, amarillo y negro (CMYK) */
  :root {
    --c: #0096c7; --m: #d6247a; --y: #e9b800; --k: #23262d;
    --fondo: #f4f6f8; --tarjeta: #ffffff; --linea: #d9dee5; --texto: #1c1f24; --suave: #5d6673;
    --ok: #1d8a4e; --riesgo: #b36b00; --tarde: #c62828;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", Roboto, system-ui, sans-serif; background: var(--fondo); color: var(--texto); line-height: 1.45; }
  header { background: var(--k); color: #fff; padding: 18px 24px; display: flex; align-items: center; gap: 14px; }
  header h1 { margin: 0; font-size: 1.35rem; font-weight: 700; letter-spacing: .2px; }
  .marcas { display: flex; gap: 4px; }
  .marcas i { width: 14px; height: 14px; border-radius: 50%; display: block; }
  main { max-width: 1100px; margin: 0 auto; padding: 20px; display: grid; gap: 20px; grid-template-columns: 320px 1fr; align-items: start; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } }
  section { background: var(--tarjeta); border: 1px solid var(--linea); border-radius: 10px; padding: 16px; }
  h2 { margin: 0 0 12px; font-size: 1.05rem; }
  label { display: block; font-size: .85rem; color: var(--suave); margin: 10px 0 3px; }
  input { width: 100%; padding: 8px 10px; border: 1px solid var(--linea); border-radius: 6px; font: inherit; background: #fff; }
  input:focus-visible, button:focus-visible { outline: 3px solid var(--c); outline-offset: 1px; }
  .fila-etapa { display: grid; grid-template-columns: 1fr 70px 32px; gap: 6px; margin-bottom: 6px; }
  button { font: inherit; cursor: pointer; border-radius: 6px; border: 1px solid var(--linea); background: #fff; padding: 8px 12px; }
  button.principal { background: var(--k); color: #fff; border-color: var(--k); width: 100%; margin-top: 14px; font-weight: 600; }
  button.link { border: none; background: none; color: var(--c); padding: 4px 0; }
  .vacio { color: var(--suave); padding: 10px 0; }
  .orden { border: 1px solid var(--linea); border-radius: 8px; padding: 12px; margin-bottom: 12px; }
  .orden-cab { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: baseline; }
  .orden-cab strong { font-size: 1rem; }
  .meta { color: var(--suave); font-size: .85rem; }
  .estado { font-size: .8rem; font-weight: 700; padding: 2px 8px; border-radius: 99px; color: #fff; }
  .estado.ok { background: var(--ok); } .estado.riesgo { background: var(--riesgo); } .estado.tarde { background: var(--tarde); }
  .barra { display: flex; height: 14px; border-radius: 7px; overflow: hidden; margin: 10px 0; background: var(--linea); }
  .barra span { display: block; }
  .etapa { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: .92rem; }
  .etapa input { width: auto; }
  .etapa .punto { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .etapa.hecha .nombre { text-decoration: line-through; color: var(--suave); }
  .etapa .fechas { margin-left: auto; color: var(--suave); font-size: .82rem; white-space: nowrap; }
  .nav-mes { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .nav-mes h2 { margin: 0; text-transform: capitalize; }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal .dia-nombre { text-align: center; font-size: .78rem; color: var(--suave); padding: 4px 0; }
  .celda { min-height: 74px; border: 1px solid var(--linea); border-radius: 6px; padding: 3px 4px; font-size: .78rem; overflow: hidden; }
  .celda.fuera { background: var(--fondo); opacity: .55; }
  .celda.hoy { border: 2px solid var(--c); }
  .celda .num { font-weight: 600; }
  .puntos { display: flex; flex-wrap: wrap; gap: 2px; margin: 2px 0; }
  .puntos i { width: 7px; height: 7px; border-radius: 50%; display: block; }
  .entrega { background: var(--k); color: #fff; border-radius: 3px; padding: 0 4px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>
<header>
  <div class="marcas" aria-hidden="true"><i style="background:var(--c)"></i><i style="background:var(--m)"></i><i style="background:var(--y)"></i><i style="background:#fff"></i></div>
  <h1>Calendario de entregas</h1>
</header>

<main>
  <!-- Formulario para crear una orden -->
  <section aria-labelledby="t-nueva">
    <h2 id="t-nueva">Nueva orden</h2>
    <form id="form-orden">
      <label for="nombre">Nombre del trabajo</label>
      <input id="nombre" required placeholder="Ej: 500 catálogos">
      <label for="cliente">Cliente</label>
      <input id="cliente" required placeholder="Ej: Librería Central">
      <label for="inicio">Fecha de inicio</label>
      <input id="inicio" type="date" required>
      <label for="entrega">Fecha de entrega</label>
      <input id="entrega" type="date" required>
      <label>Etapas y días que tarda cada una</label>
      <div id="etapas"></div>
      <button type="button" class="link" id="btn-etapa">+ Agregar etapa</button>
      <p id="msg" role="alert" style="color:var(--tarde);font-size:.88rem;margin:10px 0 0"></p>
      <button class="principal" type="submit">Guardar orden</button>
    </form>
  </section>

  <div>
    <section aria-labelledby="t-ordenes">
      <h2 id="t-ordenes">Órdenes</h2>
      <div id="lista"></div>
    </section>
    <section aria-labelledby="t-cal" style="margin-top:20px">
      <div class="nav-mes">
        <button id="mes-ant" aria-label="Mes anterior">&lt;</button>
        <h2 id="t-cal"></h2>
        <button id="mes-sig" aria-label="Mes siguiente">&gt;</button>
      </div>
      <div class="cal" id="cal"></div>
    </section>
  </div>
</main>

<script>
// ---------- Datos ----------
const CLAVE = 'calendario-entregas-v1';
const COLORES = ['var(--c)', 'var(--m)', 'var(--y)', 'var(--k)'];
const ETAPAS_BASE = [['Diseño', 2], ['Impresión', 3], ['Corte', 1], ['Cosido', 2], ['Empaque', 1]];
let ordenes = cargar();
let mesActual = new Date(); mesActual.setDate(1);

function cargar() { try { return JSON.parse(localStorage.getItem(CLAVE)) || []; } catch (e) { return []; } }
function guardar() { try { localStorage.setItem(CLAVE, JSON.stringify(ordenes)); } catch (e) {} }

// ---------- Fechas (usamos fecha local para evitar errores de zona horaria) ----------
function aFecha(texto) { const [a, m, d] = texto.split('-').map(Number); return new Date(a, m - 1, d); }
function aTexto(f) { return f.getFullYear() + '-' + String(f.getMonth() + 1).padStart(2, '0') + '-' + String(f.getDate()).padStart(2, '0'); }
function sumarDias(f, n) { const r = new Date(f); r.setDate(r.getDate() + n); return r; }
function corta(f) { return f.toLocaleDateString('es-CO', { day: 'numeric', month: 'short' }); }
function esc(t) { return String(t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

// ---------- Lógica: planear etapas una tras otra desde la fecha de inicio ----------
function planear(o) {
  let desde = aFecha(o.inicio);
  return o.etapas.map((e, i) => {
    const hasta = sumarDias(desde, e.dias - 1);
    const r = { ...e, i, desde, hasta };
    desde = sumarDias(hasta, 1);
    return r;
  });
}
function estado(o) {
  const plan = planear(o);
  const entrega = aFecha(o.entrega);
  const hoy = new Date(); hoy.setHours(0, 0, 0, 0);
  const terminada = o.etapas.every(e => e.hecha);
  const exceso = Math.round((plan[plan.length - 1].hasta - entrega) / 86400000);
  if (terminada) return { clase: 'ok', texto: 'Terminada' };
  if (entrega < hoy) return { clase: 'tarde', texto: 'Atrasada' };
  if (exceso > 0) return { clase: 'riesgo', texto: 'En riesgo: faltan ' + exceso + ' día(s)' };
  return { clase: 'ok', texto: 'A tiempo' };
}

// ---------- Formulario ----------
function agregarFila(nombre = '', dias = 1) {
  const fila = document.createElement('div');
  fila.className = 'fila-etapa';
  fila.innerHTML = '<input class="e-nombre" required placeholder="Etapa" value="' + esc(nombre) + '" aria-label="Nombre de la etapa">' +
    '<input class="e-dias" type="number" min="1" required value="' + dias + '" aria-label="Días">' +
    '<button type="button" aria-label="Quitar etapa">×</button>';
  fila.querySelector('button').onclick = () => fila.remove();
  document.getElementById('etapas').appendChild(fila);
}
ETAPAS_BASE.forEach(([n, d]) => agregarFila(n, d));
document.getElementById('btn-etapa').onclick = () => agregarFila();

function mensaje(t) { document.getElementById('msg').textContent = t; }

document.getElementById('form-orden').onsubmit = ev => {
  ev.preventDefault();
  try {
    const etapas = [...document.querySelectorAll('.fila-etapa')].map(f => ({
      nombre: f.querySelector('.e-nombre').value.trim(),
      dias: Math.max(1, parseInt(f.querySelector('.e-dias').value, 10) || 1),
      hecha: false
    }));
    if (!etapas.length) { mensaje('Agrega al menos una etapa.'); return; }
    const inicio = document.getElementById('inicio').value;
    const entrega = document.getElementById('entrega').value;
    if (!inicio || !entrega) { mensaje('Escoge la fecha de inicio y la de entrega.'); return; }
    if (entrega < inicio) { mensaje('La fecha de entrega no puede ser antes de la fecha de inicio.'); return; }
    ordenes.push({
      id: Date.now(),
      nombre: document.getElementById('nombre').value.trim(),
      cliente: document.getElementById('cliente').value.trim(),
      inicio, entrega, etapas
    });
    guardar();
    mensaje('');
    pintar();
    // Limpiar solo los campos de la orden; las etapas se dejan para la siguiente
    ['nombre', 'cliente', 'inicio', 'entrega'].forEach(id => document.getElementById(id).value = '');
  } catch (e) {
    mensaje('Error: ' + e.message);
  }
};

// ---------- Pintar en pantalla ----------
function pintarLista() {
  const cont = document.getElementById('lista');
  if (!ordenes.length) { cont.innerHTML = '<p class="vacio">Aún no hay órdenes. Crea la primera con el formulario.</p>'; return; }
  const ordenadas = [...ordenes].sort((a, b) => a.entrega.localeCompare(b.entrega));
  cont.innerHTML = ordenadas.map(o => {
    const plan = planear(o), est = estado(o);
    const total = o.etapas.reduce((s, e) => s + e.dias, 0);
    const barra = plan.map(e => '<span title="' + esc(e.nombre) + '" style="width:' + (e.dias / total * 100) + '%;background:' + COLORES[e.i % 4] + ';opacity:' + (e.hecha ? 1 : .35) + '"></span>').join('');
    const etapas = plan.map(e =>
      '<label class="etapa' + (e.hecha ? ' hecha' : '') + '">' +
      '<input type="checkbox" data-orden="' + o.id + '" data-etapa="' + e.i + '"' + (e.hecha ? ' checked' : '') + '>' +
      '<span class="punto" style="background:' + COLORES[e.i % 4] + '"></span>' +
      '<span class="nombre">' + esc(e.nombre) + ' (' + e.dias + ' d)</span>' +
      '<span class="fechas">' + corta(e.desde) + ' – ' + corta(e.hasta) + '</span></label>').join('');
    return '<article class="orden"><div class="orden-cab"><strong>' + esc(o.nombre) + '</strong>' +
      '<span class="estado ' + est.clase + '">' + est.texto + '</span></div>' +
      '<div class="meta">' + esc(o.cliente) + ' · Entrega: ' + corta(aFecha(o.entrega)) + '</div>' +
      '<div class="barra">' + barra + '</div>' + etapas +
      '<button class="link" data-borrar="' + o.id + '">Eliminar orden</button></article>';
  }).join('');
}

function pintarCalendario() {
  const anio = mesActual.getFullYear(), mes = mesActual.getMonth();
  document.getElementById('t-cal').textContent = mesActual.toLocaleDateString('es-CO', { month: 'long', year: 'numeric' });
  const cal = document.getElementById('cal');
  let html = ['L', 'M', 'X', 'J', 'V', 'S', 'D'].map(d => '<div class="dia-nombre">' + d + '</div>').join('');
  const primero = new Date(anio, mes, 1);
  const desfase = (primero.getDay() + 6) % 7; // la semana empieza en lunes
  const hoyTexto = aTexto(new Date());
  const planes = ordenes.map(o => ({ o, plan: planear(o) }));
  for (let n = 0; n < 42; n++) {
    const dia = sumarDias(primero, n - desfase);
    const t = aTexto(dia);
    const puntos = [], entregas = [];
    planes.forEach(({ o, plan }) => {
      plan.forEach(e => { if (dia >= e.desde && dia <= e.hasta) puntos.push('<i title="' + esc(o.nombre + ': ' + e.nombre) + '" style="background:' + COLORES[e.i % 4] + '"></i>'); });
      if (o.entrega === t) entregas.push('<div class="entrega" title="Entrega: ' + esc(o.nombre) + '">' + esc(o.nombre) + '</div>');
    });
    html += '<div class="celda' + (dia.getMonth() !== mes ? ' fuera' : '') + (t === hoyTexto ? ' hoy' : '') + '">' +
      '<span class="num">' + dia.getDate() + '</span><div class="puntos">' + puntos.join('') + '</div>' + entregas.join('') + '</div>';
  }
  cal.innerHTML = html;
}

function pintar() { pintarLista(); pintarCalendario(); }

// ---------- Eventos ----------
document.getElementById('lista').addEventListener('change', ev => {
  const c = ev.target;
  if (c.dataset.orden === undefined) return;
  const o = ordenes.find(x => x.id === Number(c.dataset.orden));
  o.etapas[Number(c.dataset.etapa)].hecha = c.checked;
  guardar(); pintar();
});
document.getElementById('lista').addEventListener('click', ev => {
  const id = ev.target.dataset.borrar;
  if (id) { ordenes = ordenes.filter(o => o.id !== Number(id)); guardar(); pintar(); }
});
document.getElementById('mes-ant').onclick = () => { mesActual.setMonth(mesActual.getMonth() - 1); pintarCalendario(); };
document.getElementById('mes-sig').onclick = () => { mesActual.setMonth(mesActual.getMonth() + 1); pintarCalendario(); };

pintar();
</script>
</body>
</html>
